
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveSub Player Test</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #111827;
            color: white;
            font-family: -apple-system, sans-serif;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
        }

        h1 {
            text-align: center;
            font-size: 30px;
        }

        .subtitle {
            text-align: center;
            color: #9ca3af;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 20px 0 10px;
            border-radius: 8px;
            border: none;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        .player {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            margin-top: 25px;
            background: black;
            border-radius: 12px;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        .caption {
            position: absolute;
            bottom: 12%;
            left: 5%;
            width: 90%;
            text-align: center;
            pointer-events: none;
            font-size: 20px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 5px black;
        }

        #status {
            color: #9ca3af;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>LiveSub</h1>

    <p class="subtitle">多语言实时直播翻译测试</p>

    <input
        id="videoURL"
        type="url"
        placeholder="粘贴 YouTube 视频或直播链接"
    >

    <button onclick="loadVideo()">
        加载视频
    </button>

    <div class="player" id="player">
        <div id="placeholder"
             style="text-align:center;padding-top:20%;">
            等待加载视频
        </div>
    </div>

    <p id="status">播放器准备就绪</p>

</div>

<script>
function extractVideoID(url) {
    try {
        const parsed = new URL(url);

        let id = null;

        if (parsed.hostname === "youtu.be") {
            id = parsed.pathname.split("/")[1];
        } else if (
            parsed.hostname === "youtube.com" ||
            parsed.hostname.endsWith(".youtube.com")
        ) {
            id = parsed.searchParams.get("v");

            if (!id) {
                const parts = parsed.pathname.split("/");
                if (["live", "embed", "shorts"].includes(parts[1])) {
                    id = parts[2];
                }
            }
        }

        return id && /^[a-zA-Z0-9_-]{11}$/.test(id)
            ? id : null;

    } catch {
        return null;
    }
}

function loadVideo() {
    const url = document.getElementById("videoURL").value;
    const id = extractVideoID(url);
    const player = document.getElementById("player");
    const status = document.getElementById("status");

    if (!id) {
        status.textContent = "请输入正确的 YouTube 链接";
        return;
    }

    const origin = encodeURIComponent(location.origin);

    player.innerHTML = `
        <iframe
            src="https://www.youtube.com/embed/${id}?playsinline=1&enablejsapi=1&origin=${origin}"
            allow="autoplay; encrypted-media; picture-in-picture"
            allowfullscreen
            referrerpolicy="origin">
        </iframe>

        <div class="caption" id="caption">
            LiveSub 中文字幕测试
        </div>
    `;

    status.textContent = "播放器已加载，请检查播放情况";
}
</script>

</body>
</html>
